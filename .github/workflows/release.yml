name: Release

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Attach integration zip to release
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the zip as a release asset
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Update manifest version from tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          jq --arg v "$VERSION" '.version = $v' custom_components/bosch_ebike/manifest.json > tmp.json
          mv tmp.json custom_components/bosch_ebike/manifest.json

      - name: Package custom_components
        run: |
          cd custom_components
          zip -r ../bosch_ebike.zip bosch_ebike/

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" bosch_ebike.zip --clobber
