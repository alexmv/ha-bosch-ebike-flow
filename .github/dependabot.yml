version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python-deps:
        patterns: ["*"]
    ignore:
      # The tests run against the oldest Home Assistant that hacs.json
      # supports.  These two move in lockstep (the plugin pins an exact
      # homeassistant version), and are bumped by hand along with hacs.json.
      - dependency-name: homeassistant
      - dependency-name: pytest-homeassistant-custom-component
